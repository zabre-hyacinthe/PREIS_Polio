name: PREIS Polio Daily Pipeline

on:
  schedule:
    # 8h00 Afrique de l'Est (EAT = UTC+3)  ->  5h00 UTC
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Mode test (true = aucun email envoye)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

concurrency:
  group: preis-polio-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      ALERT_FROM: ${{ secrets.ALERT_FROM }}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "465"
      # Cron (schedule) -> false (vrais envois). Lancement manuel -> choix utilisateur.
      PREIS_DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || github.event.inputs.dry_run }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev \
            libgdal-dev libudunits2-dev libproj-dev libgeos-dev libfontconfig1-dev

      - name: Install and cache R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::blastula
            any::readr
            any::dplyr
            any::stringr
            any::tibble
            any::tidyr
            any::purrr
            any::lubridate
            any::jsonlite
            any::rvest
            any::xml2
            any::httr2
            any::openssl
          cache: always

      - name: Verify R packages
        run: |
          Rscript -e '
            packages <- c("blastula","readr","dplyr","stringr","tibble","tidyr",
                          "purrr","lubridate","jsonlite","rvest","xml2","httr2","openssl");
            missing <- packages[!vapply(packages, requireNamespace, logical(1), quietly = TRUE)];
            if (length(missing) > 0) {
              stop("Packages R absents apres installation: ", paste(missing, collapse=", "))
            } else {
              cat("Tous les packages R requis sont disponibles\n");
              cat("blastula version:", as.character(packageVersion("blastula")), "\n")
            }
          '

      - name: Run Polio cloud pipeline
        run: |
          Rscript R/120_run_polio_cloud.R

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/dashboard/ data/final/preis_common/ data/processed/ \
            data/last_issue.txt outputs/email/polio_email_sent_log.csv || true
          if git diff --cached --quiet; then
            echo "No data change to commit."
          else
            git commit -m "Update PREIS Polio data [skip ci]"
            git push
          fi
